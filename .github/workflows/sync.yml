name: Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        run: |
          curl -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://war-room-by-fire-nova.vercel.app/api/cron/sync
        continue-on-error: true
